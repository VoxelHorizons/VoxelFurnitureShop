schema: 1

rotation:
  enabled: true
  # A Minecraft day is 24000 ticks (normally 20 real minutes). Shops rotate when the world day changes.
  check-interval-ticks: 100
  restock-delay-ticks: 80
  reopen-delay-ticks: 20
  avoid-current-variant: true
tooltip:
  enabled: true
  tooltip: default
  # Only active variant furniture with an explicit configured value displays this tooltip.
  # Fixtures, curtains and shared doors are excluded.
  # Furniture without worth metadata still displays its name (but is not for sale).
  unpriced-label: 'Price unavailable'
  buy-label: 'Click to Buy'
  not-for-sale-label: 'Not for sale'
  max-distance: 5.0
  check-interval-ticks: 5
  lore:
  - "&f<furniture>"
  - "&6<furniture_value> &f:shop_coin:"
  - "&f:shop_mouse: &7<furniture_action>"
