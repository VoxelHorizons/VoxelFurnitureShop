schema: 1

rotation:
  enabled: true
  # A Minecraft day is 24000 ticks (normally 20 real minutes). Shops rotate when the world day changes.
  check-interval-ticks: 100
  restock-delay-ticks: 80
  reopen-delay-ticks: 20
  avoid-current-variant: true
economy:
  # Default currency for legacy numeric worth: 250.
  default-currency: coins
  # Original Vault exposes one unnamed currency; this aliases its ID.
  # Set to "" to route even this ID through VaultUnlocked.
  legacy-currency: coins

tooltip:
  enabled: true
  tooltip: default
  # Only active-variant furniture gets tooltips; fixtures are excluded.
  # A missing furniture value selects the alternative second and third lines.
  max-distance: 5.0
  check-interval-ticks: 5
  title: "&f<furniture>"
  # <furniture_prices> includes every configured purchase currency.
  available-line: "<furniture_prices>"
  # Default display for any named currency without an override.
  currency-format: "&6<amount> &f<currency>"
  currency-formats:
    coins: "&6<amount> &f:shop_coin:"
  currency-separator: " &7or "
  unavailable-line: "&6Price unavailable &f:shop_coin:"
  sale-line: "&f:shop_mouse: &7Click to Buy"
  not-for-sale-line: "&f:shop_mouse: &7Not for sale"

# Both purchasing GUIs use a single inventory row (9 slots) on Java and
# Bedrock. Your VoxelCore font glyph draws the artwork; slots 0–8 are the
# only clickable top-inventory hitboxes.
# Original confirmation GUI; used for all priced furniture.
# With multiple available currencies, green opens the optional choice GUI below.
purchase-ui:
  title: ":offset_-8::furniture_shop::offset_8:&rPurchase Furniture"
  button-item: "voxel:ui/blank"
  preview-slot: 4
  cancel-slots: [1, 2]
  purchase-slots: [6, 7]

  # Only opened when the item offers more than one available currency.
  # The supplied artwork has a Coins button on the left and Tokens on the right.
  # Add more named currencies here if your economy provider exposes them.
  currency-selection:
    title: ":offset_-8::furniture_shop_currency::offset_8:&rSelect Currency"
    button-item: "voxel:ui/blank"
    preview-slot: 4
    currencies:
      coins: [1, 2]
      tokens: [6, 7]

# Per-currency insufficient-balance messages. Other currency IDs use default.
# <price>/<amount>, <currency> and <furniture> can be used in every message.
messages:
  insufficient-funds:
    default: "&cYou need <price> <currency> to buy <furniture>."
    currencies:
      coins: "&cYou need <price> Coins to buy <furniture>."
      tokens: "&cYou need <price> Tokens to buy <furniture>."
