schema: 1

rotation:
  enabled: true
  # A Minecraft day is 24000 ticks (normally 20 real minutes). Shops rotate when the world day changes.
  check-interval-ticks: 100
  restock-delay-ticks: 80
  reopen-delay-ticks: 20
  avoid-current-variant: true
economy:
  # Default currency for legacy numeric worth: 250.
  default-currency: coins
  # Original Vault exposes one unnamed currency; this aliases its ID.
  # Set to "" to route even this ID through VaultUnlocked.
  legacy-currency: coins

tooltip:
  enabled: true
  tooltip: default
  # Only active-variant furniture gets tooltips; fixtures are excluded.
  # A missing furniture value selects the alternative second and third lines.
  max-distance: 5.0
  check-interval-ticks: 5
  title: "&f<furniture>"
  # <furniture_prices> includes every configured purchase currency.
  available-line: "<furniture_prices>"
  # Default display for any named currency without an override.
  currency-format: "&6<amount> &f<currency>"
  currency-formats:
    coins: "&6<amount> &f:shop_coin:"
  currency-separator: " &7or "
  unavailable-line: "&6Price unavailable &f:shop_coin:"
  sale-line: "&f:shop_mouse: &7Click to Buy"
  not-for-sale-line: "&f:shop_mouse: &7Not for sale"

# A native 3-row inventory is used on both Java and Bedrock. Your custom
# VoxelCore font glyph supplies the visible background; the actions remain
# actual Bukkit inventory slot hitboxes (0-26), not arbitrary pixel regions.
purchase-ui:
  title: "&8Furniture Purchase"
  glyphs:
    # Examples after defining font glyphs in VoxelCore:
    # selection: "&f:shop_purchase_selection:"
    # confirmation: "&f:shop_purchase_confirmation:"
    selection: ""
    confirmation: ""
  # False hides vanilla buttons for a fully custom font-overlay interface.
  # The furniture preview remains visible, and all action slots remain clickable.
  show-button-items: true
  preview-slot: 4
  selection:
    cancel-slot: 0
    previous-page-slot: 18
    next-page-slot: 26
    # Payment options fill these hitboxes in this order, one currency per slot.
    currency-slots: [10, 11, 12, 13, 14, 15, 16]
  confirmation:
    cancel-slot: 0
    purchase-slot: 8
    back-slot: 18
