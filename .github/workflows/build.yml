name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: VoxelFurnitureShop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VoxelHorizons/VoxelCore
          ref: 73b337ccbad41cbbae5a0573e4a30a7742539ba7 # Pinned VoxelCore commit
          path: VoxelCore
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VoxelHorizons/VoxelFurniture
          ref: 86b1ba2bad2ffc88102ef3ac3b5b1a48361218f0 # Pinned VoxelFurniture commit
          path: VoxelFurniture
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install VoxelCore dependencies for furniture shop
        # Only common/pack/plugin are needed. Building the full reactor pulls in
        # unrelated version adapters and the Geyser extension, which can fail on
        # unavailable third-party snapshots even when this plugin is healthy.
        run: mvn -B -f VoxelCore/pom.xml -pl voxelcore-plugin -am install -DskipTests
      - name: Install VoxelFurniture
        run: mvn -B -f VoxelFurniture/pom.xml install -DskipTests
      - name: Verify VoxelFurnitureShop
        run: mvn -B -f VoxelFurnitureShop/pom.xml verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VoxelFurnitureShop-mc1.12-26.3
          path: VoxelFurnitureShop/target/VoxelFurnitureShop-*.jar
          if-no-files-found: error

